<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿噜的棋桌邀请</title><meta name="robots" content="noindex"><style>*{box-sizing:border-box}body{margin:0;background:#faf7f0;color:#554b5d;font:16px/1.6 system-ui,-apple-system,'Noto Sans SC','Microsoft Yahei',sans-serif}main{max-width:340px;padding:52px 22px 28px;margin:auto;text-align:center}img{width:110px;height:110px;object-fit:contain}h1{font-size:25px;margin:12px 0 4px}p{color:#918797;font-size:14px;margin:8px 0 20px}.code{font-size:28px;letter-spacing:5px;padding:12px 0;color:#8b74b3}a,button{display:block;width:100%;border:0;border-radius:25px;padding:12px;background:#967fb8;color:white;text-decoration:none;font:inherit;cursor:pointer}button{margin:10px 0;background:#eee7f5;color:#8b74b3}footer{margin-top:30px;color:#a198a5;font-size:12px}footer a{font-size:13px;margin-top:10px;background:none;color:#8b74b3}a[aria-disabled=true]{pointer-events:none;opacity:.45}</style><main><img src="aru.png" alt="阿噜"><h1 id="title">阿噜摆好棋桌啦 ♡</h1><p id="description">一张邀请，连起远方</p><div class="code" id="code"></div><a id="open" aria-disabled="true">打开叽里咕噜，加入棋桌</a><button id="copy" hidden>复制房间码</button><footer>房间等待 5 分钟，双方请使用支持邀请的新版本。<a href="https://github.com/Xiamol/jiligulu/releases/latest">还没安装？看看最新版本</a></footer></main><script>
const params=new URLSearchParams(location.search),game=params.get('game'),code=(params.get('code')||'').toUpperCase();const valid=['xiangqi','gomoku'].includes(game)&&/^[A-Z0-9]{4,12}$/.test(code)&&params.getAll('game').length===1&&params.getAll('code').length===1&&[...params.keys()].every(k=>k==='game'||k==='code');
if(valid){document.getElementById('description').textContent=`来下一盘${game==='xiangqi'?'象棋':'五子棋'}吧`;document.getElementById('code').textContent=code;const open=document.getElementById('open');open.setAttribute('aria-disabled','false');const query=`game=${game}&code=${code}`;const custom=`jiligulu://chess/join?${query}`;open.href=/Android/i.test(navigator.userAgent)?`intent://chess/join?${query}#Intent;scheme=jiligulu;package=com.jiligulu.app;end`:custom;const copy=document.getElementById('copy');copy.hidden=false;copy.onclick=async()=>{try{await navigator.clipboard.writeText(code);copy.textContent='复制好啦 ♡'}catch{copy.textContent=`房间码：${code}`}};}else{document.getElementById('title').textContent='这张邀请好像折坏了';document.getElementById('description').textContent='让棋友重新分享一张完整的邀请吧';}
</script></html>
