<!doctype html><meta charset="utf-8"><script src="https://appassets.androidplatform.net/peerjs.min.js"></script><script>
'use strict';
let peer=null,connection=null,host=false;
function emit(type,value=''){if(window.GuluTransport)GuluTransport.event(type,String(value).slice(0,2048));}
function bind(c){
  if(connection){c.close();return;}
  if(c.metadata?.protocol!=='gulu-xq-1'){c.close();return;}
  connection=c;
  c.on('open',()=>emit('connected'));
  c.on('data',data=>{if(typeof data==='string'&&data.length<=1024)emit('data',data);else emit('error','invalid-data');});
  c.on('close',()=>emit('closed'));
  c.on('error',()=>emit('error','webrtc'));
}
function guluStart(code,isHost){
  host=isHost;
  if(typeof Peer!=='function'){emit('error','browser-incompatible');return;}
  peer=new Peer(host?'gulu-xq-'+code:undefined,{secure:true,debug:0});
  peer.on('open',()=>{
    emit('ready');
    if(!host){bind(peer.connect('gulu-xq-'+code,{serialization:'json',reliable:true,metadata:{protocol:'gulu-xq-1'}}));}
  });
  peer.on('connection',c=>{if(host)bind(c);else c.close();});
  peer.on('error',err=>{if(connection?.open&&err.type==='network')emit('warning');else emit('error',err.type||'network');});
  peer.on('close',()=>emit('closed'));
}
function guluSend(line){if(connection?.open)connection.send(line);else emit('error','disconnected');}
function guluStop(){if(connection){connection.removeAllListeners();connection.close();connection=null;}if(peer){peer.removeAllListeners();peer.destroy();peer=null;}}
</script>
